services:
  - type: web
    name: palprocure
    runtime: node
    plan: free
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: FIXTURE_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
